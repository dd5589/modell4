<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DXA Quality AI</title><style>body{font-family:system-ui;margin:2rem;max-width:900px}button{padding:.6rem 1rem}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem;border-radius:8px}table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{border:1px solid #ddd;padding:.5rem;text-align:left}.ok{font-weight:700}</style></head><body><h1>DXA Quality AI</h1><p>Локальный сервис контроля качества денситометрии.</p><input id="file" type="file" accept=".dcm"><label><input id="explain" type="checkbox"> heatmap</label><button onclick="run()">Проверить</button><div id="out"></div><script>async function run(){const f=document.getElementById('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/predict?explain='+document.getElementById('explain').checked,{method:'POST',body:fd});const j=await r.json();document.getElementById('out').innerHTML='<pre>'+JSON.stringify(j,null,2)+'</pre>';}</script></body></html>
